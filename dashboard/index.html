<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>CouSy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a href="#content" class="skip-link">Zum Inhalt springen</a>
  <!-- Login -->
  <div id="login-screen" class="screen">
    <div class="login-container">
      <h1 class="login-title">CouSy</h1>
      <p class="login-subtitle">Couple Sync</p>
      <form id="login-form">
        <label for="login-username" class="sr-only">Benutzername</label>
        <input type="text" id="login-username" name="username" placeholder="Benutzername" autocomplete="username" required>
        <label for="login-password" class="sr-only">Passwort</label>
        <input type="password" id="login-password" name="password" placeholder="Passwort" autocomplete="current-password" required>
        <button type="submit" class="btn-primary">Anmelden</button>
        <p id="login-error" class="error-text" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <!-- Main App -->
  <div id="app-screen" class="screen" style="display:none">
    <header id="app-header">
      <h2 id="header-title">Home</h2>
      <button id="header-action" class="header-btn" style="display:none"></button>
    </header>

    <main id="content"></main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav">
      <button class="nav-btn active" data-view="home" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-btn" data-view="checkin" aria-label="Check-In">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Check-In</span>
      </button>
      <button class="nav-btn" data-view="trends" aria-label="Trends">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Trends</span>
      </button>
      <button class="nav-btn" data-view="dates" aria-label="Dates">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span>Dates</span>
      </button>
      <button class="nav-btn" data-view="planer" aria-label="Planer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Planer</span>
      </button>
      <button class="nav-btn" data-view="zyklus" aria-label="Zyklus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span>Zyklus</span>
      </button>
      <button class="nav-btn" data-view="watch" aria-label="Watchlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        <span>Watch</span>
      </button>
    </nav>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div id="modal-sheet" class="modal-sheet">
      <div class="modal-handle"></div>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
